<!DOCTYPE html>
<html>
<head>
    <style>
        body {
    
            font-family: Arial, sans-serif;
    
            background: aliceblue;
    
            text-align: center;
    
            padding: 30px;
    
        }
    
        h1 {
    
            color: navy;
    
        }
    
        input {
    
            padding: 8px;
    
            margin: 5px;
    
            border: 2px solid navy;
    
            border-radius: 6px;
    
            width: 220px;
    
        }
    
        button {
    
            background: navy;
    
            color: white;
    
            padding: 10px 25px;
    
            border: none;
    
            border-radius: 20px;
    
            cursor: pointer;
    
        }
    
        #timer {
    
            color: grey;
    
        }
    </style>
</head>  
<body>
  <h1>Lucky Draw</h1>  
  <p>Enter Your Name & Guess A Number To Win </p>
  <input type="text" id="name" placeholder="enter your name" required><br>
  <p id="msg-name"></p>

<input type="guess" id="geuss a number (1 to 5)" placeholder="enter your geuss" min="1" max="5" required><br>
<p id="msg-geuss"></p>

<button onclick="checkform()">Try My Luck</button>
<p id="result"></p>
<p id="timer"></p>
<script>
 
 var sec=0;
 setInterval (function(){
   sec=sec+1;
   document.getElementById("timer").textContent="You Have Been Here For "+ sec + " sec!"
 },1000
 );
 function checkform(){
var name= document.getElementById("name").value;
var guess= document.getElementById("guess").value;
var ok = true;
if (name== ""){
document.getElementById("msg-name").textContent="please enter your name";
document.getElementById("msg-name").style.color="red";
ok=false;    
}else{
document.getElementById("msg-name").textContent="great name";
document.getElementById("msg-name").style.color="green";
}
     if (guess == "") {
         document.getElementById("msg-guess").textContent = "please enter your guess";
         document.getElementById("msg-guess").style.color = "red";
         ok = false;
     } else {
         document.getElementById("msg-guess").textContent = "guess saved";
         document.getElementById("msg-guess").style.color = "green";
     }
     if (ok == true) {

         var lucky = Math.floor(Math.random() * 5) + 1;
        }
        if (guess==lucky){
document.getElementById("result").textContent="you win";
        }else{
            document.getElementById("result").textContent="so close";
        }
    }         
</script>
</body>  
</html>
